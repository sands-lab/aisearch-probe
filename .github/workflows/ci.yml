name: CI

# Formatting, vet, build and tests for the Go code, then the Python tests.
# The Go code uses the standard library only, so there is no module download.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: python tests
        run: |
          pip install pytest matplotlib numpy
          python -m pytest scripts -q
